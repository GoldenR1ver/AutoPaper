<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutoPaper</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div class="app" id="app">
    <header>
      <div class="brand">
        <span class="mark" aria-hidden="true">Ap</span>
        <div>
          <strong>AutoPaper</strong>
          <p>按相关度整理、阅读和上传</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="mode" role="tablist">
          <button type="button" id="mode-papers" class="active" role="tab">论文相关</button>
          <button type="button" id="mode-network" role="tab">知识网络</button>
        </div>
        <button type="button" id="library-open">我的笔记库</button>
        <button type="button" id="fill-biblio">补全题录</button>
        <button type="button" id="dedupe-open">合并重复</button>
        <button type="button" class="primary" id="upload-open">上传论文</button>
      </div>
    </header>
    <aside class="rail">
      <label class="search">
        <span>搜索</span>
        <input id="query" type="search" placeholder="标题或一句话" />
      </label>
      <label class="slider-row">
        <span>相关度</span>
        <input id="min-weight" type="range" min="0" max="90" value="40" />
        <output id="min-weight-label">40</output>
      </label>
      <section>
        <div class="section-head"><h2>作者</h2><button type="button" id="clear-authors" class="text">清空</button></div>
        <div id="author-filters" class="chips"></div>
      </section>
      <section>
        <div class="section-head"><h2>主题</h2><button type="button" id="classify-topics" class="text">再分类</button><button type="button" id="clear-topics" class="text">清空</button></div>
        <div id="topic-filters" class="chips"></div>
      </section>
      <section class="list-section">
        <div class="section-head">
          <h2 id="list-title">论文</h2>
          <button type="button" id="reset-layout" class="text">重排</button>
        </div>
        <div id="profile-actions" class="chips"></div>
        <div id="paper-list" class="paper-list"></div>
      </section>
    </aside>
    <main>
      <canvas id="graph"></canvas>
      <div class="hud">
        <p id="graph-status"></p>
        <div class="legend">
          <span><i class="swatch paper"></i>论文</span>
          <span><i class="swatch author"></i>作者</span>
          <span><i class="swatch topic"></i>主题</span>
          <span>绿线越粗，笔记越接近；细线表示同一作者或主题</span>
        </div>
      </div>
      <p id="graph-empty" hidden>库里还没有论文。点右上角上传后，它们会按相关度出现在图上。</p>
    </main>
    <aside class="reader" id="reader" hidden>
      <div class="reader-bar">
        <button type="button" id="reader-close">关闭</button>
        <span id="note-updated"></span>
        <span class="reader-actions">
          <button type="button" id="update-note" hidden>更新笔记</button>
          <button type="button" id="delete-note" class="text danger" hidden>删除笔记</button>
          <button type="button" id="delete-record" class="text danger" hidden>删除</button>
          <span id="open-file" class="open-file" hidden>
            <button type="button" id="open-file-toggle" aria-expanded="false" aria-controls="open-file-menu">打开原文</button>
            <span id="open-file-menu" class="open-file-menu" hidden>
              <a id="open-file-web" target="_blank" rel="noreferrer">从网页打开原文</a>
              <button type="button" id="open-file-local">用本机阅读器打开</button>
              <button type="button" id="open-file-annotate" hidden>自动批注原文</button>
              <p id="open-file-status" class="open-file-status" hidden></p>
            </span>
          </span>
        </span>
      </div>
      <div id="reader-body"></div>
    </aside>
  </div>

  <dialog id="upload-dialog">
    <form id="upload-form" method="dialog">
      <header>
        <h2>上传论文</h2>
        <button type="button" id="upload-close" class="text">关闭</button>
      </header>
      <label class="drop">
        <input id="files" type="file" multiple accept=".pdf,.txt,.md,.markdown,application/pdf,text/plain,text/markdown" />
        <input id="folder" type="file" webkitdirectory directory multiple />
        <span id="file-label">选择文件，或选择整个文件夹。同名论文会自动跳过。</span>
      </label>
      <div id="upload-papers"></div>
      <p class="hint">每篇会单独根据作者栏、摘要和结论建议。默认勾选一作、二作和通信作者，并列出论文关键词，其中前两个默认勾选。再分类时会为已有论文补上一作、二作和前两个关键词。题名相同、一短一长的副标题、或 DOI 等标识相同，都会当作同一篇跳过。仍可以改。新论文归类后会自动生成笔记。</p>
      <p id="upload-message" class="message"></p>
      <div class="dialog-actions">
        <button type="submit" class="primary" id="upload-submit">开始上传</button>
      </div>
    </form>
  </dialog>
  <dialog id="dedupe-dialog">
    <form method="dialog">
      <header>
        <h2>合并重复论文</h2>
        <button type="button" id="dedupe-close" class="text">关闭</button>
      </header>
      <div id="dedupe-groups"></div>
      <p id="dedupe-message" class="message"></p>
      <div class="dialog-actions">
        <button type="button" class="primary" id="dedupe-merge">合并这些重复</button>
      </div>
    </form>
  </dialog>
  <div id="select-menu" hidden>
    <button type="button" class="color-dot yellow" data-color="yellow" title="黄色高亮"></button>
    <button type="button" class="color-dot green" data-color="green" title="绿色高亮"></button>
    <button type="button" class="color-dot blue" data-color="blue" title="蓝色高亮"></button>
    <button type="button" class="color-dot pink" data-color="pink" title="粉色高亮"></button>
    <button type="button" class="color-dot orange" data-color="orange" title="橙色高亮"></button>
    <button type="button" id="select-annotate" class="text">批注</button>
    <button type="button" id="select-ask" class="text">追问</button>
    <div id="ask-box" hidden>
      <div id="ask-questions" class="chips"></div>
      <div class="ask-custom">
        <input id="ask-custom" type="text" placeholder="或写下自己的问题" />
        <button type="button" id="ask-custom-send" class="text">提问</button>
      </div>
      <p id="ask-answer" class="meta-line"></p>
      <button type="button" id="ask-save" class="primary" disabled>快速保存为笔记</button>
    </div>
    <div id="annotate-box" hidden>
      <textarea id="annotate-text" placeholder="写下批注"></textarea>
      <button type="button" class="primary" id="annotate-save">保存</button>
    </div>
  </div>
  <script src="/assets/app.js"></script>
</body>
</html>
